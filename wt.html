<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WT – ITM SLS</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--bg:#f1f5f9;--card:#fff;--line:#e2e8f0;--accent:#2563eb;--accent2:#1e3a8a}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
header{position:relative;overflow:hidden;color:#fff;padding:56px 0 84px;background:linear-gradient(135deg,var(--accent2),var(--accent))}
header::before,header::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
header::before{width:320px;height:320px;right:-80px;top:-120px}
header::after{width:200px;height:200px;left:-60px;bottom:-110px}
header .wrap{position:relative;z-index:1}
.badge{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);padding:4px 14px;border-radius:999px;font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px}
h1{margin:0 0 10px;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1.08;font-weight:800;letter-spacing:-.02em}
h1 em{font-style:normal;background:linear-gradient(transparent 62%,rgba(255,214,10,.85) 62%);padding:0 4px}
header p{margin:0;max-width:50ch;font-size:1.05rem;color:rgba(255,255,255,.88)}
.back{display:inline-block;margin-bottom:20px;padding:7px 16px;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;font-size:.9rem;font-weight:600;text-decoration:none;transition:background .15s}
.back:hover{background:rgba(255,255,255,.28)}
main{margin-top:-46px;position:relative;z-index:2;padding-bottom:50px}
.section-title{margin:0 0 14px;font-size:.85rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.subjects{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
li{background:var(--card);border-radius:18px;box-shadow:0 1px 3px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);transition:transform .18s,box-shadow .18s;overflow:hidden}
li:hover{transform:translateY(-4px);box-shadow:0 2px 6px rgba(15,23,42,.08),0 16px 36px rgba(15,23,42,.14)}
li a{display:flex;align-items:center;gap:16px;padding:18px;color:inherit;text-decoration:none;border-top:5px solid var(--c,var(--accent))}
li a:focus-visible{outline:3px solid var(--c,var(--accent));outline-offset:-3px}
.icon{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:1.6rem;background:color-mix(in srgb,var(--c,var(--accent)) 14%,white)}
.txt{flex:1;min-width:0}
.title{font-weight:800;font-size:1.15rem;letter-spacing:.01em;overflow-wrap:anywhere}
.meta{font-size:.85rem;color:var(--muted);margin-top:1px}
.arrow{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--c,var(--accent));color:#fff;font-size:1.05rem;transition:transform .18s}
li:hover .arrow{transform:translateX(4px)}
li:hover .title{color:var(--c,var(--accent))}
.count{display:inline-block;margin:0 0 14px;padding:5px 14px;border-radius:999px;background:var(--card);color:var(--muted);font-size:.85rem;font-weight:600;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.empty{padding:34px 20px;text-align:center;color:var(--muted);border:2px dashed var(--line);box-shadow:none;background:transparent;border-radius:18px}
.empty:hover{transform:none;box-shadow:none}
footer{background:var(--ink);color:#94a3b8;padding:26px 0;font-size:.88rem;text-align:center}
footer a{color:#fff}
@media (max-width:560px){header{padding:40px 0 70px}li a{padding:15px}}
</style>
</head>
<body style="--accent:#2563eb;--accent2:#1e3a8a;--c:#2563eb">
<header><div class="wrap">
  <a class="back" href="index.html">&larr; All subjects</a><br>
  <span class="badge">🌐 Notes</span>
  <h1><em>WT</em></h1>
  <p>All notes for WT in one place. Tap a note to open it.</p>
</div></header>
<main class="wrap">
  <p class="count" id="count"></p>
  <ul id="list"></ul>
</main>
<footer><div class="wrap">ITM SLS &middot; Made by VD &middot; Found a mistake or want to add material? <a href="mailto:v.d.14112008@gmail.com">v.d.14112008@gmail.com</a></div></footer>
<script>
/* ============================================================
   HOW TO ADD NOTES TO THIS SUBJECT
   1. Put the PDF in the folder:  materials/wt/
   2. Copy one line below, paste it at the end of the list, edit it.
   3. Save and upload the changes to GitHub.
   Fields: title (name shown on the card), file (path to the PDF)
   ============================================================ */
const NOTES = [
  { title: "UNIT 1", file: "materials/wt/Unit 1_ Introduction to World Wide Web(WWW).pdf" }
];
const list = document.getElementById("list");
document.getElementById("count").textContent = NOTES.length + (NOTES.length === 1 ? " file" : " files");
if (!NOTES.length) {
  list.innerHTML = '<li class="empty">No notes here yet. Check back soon.</li>';
}
NOTES.forEach(n => {
  const li = document.createElement("li");
  const a = document.createElement("a");
  a.href = n.file; a.target = "_blank"; a.rel = "noopener";
  const ic = document.createElement("div"); ic.className = "icon"; ic.textContent = "\ud83d\udcc4";
  const tx = document.createElement("div"); tx.className = "txt";
  const t = document.createElement("div"); t.className = "title"; t.textContent = n.title;
  const m = document.createElement("div"); m.className = "meta"; m.textContent = "PDF \u00b7 tap to open";
  tx.append(t, m);
  const ar = document.createElement("span"); ar.className = "arrow"; ar.textContent = "\u2192";
  ar.setAttribute("aria-hidden", "true");
  a.append(ic, tx, ar); li.appendChild(a); list.appendChild(li);
});
</script>
</body>
</html>
